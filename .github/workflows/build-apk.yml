name: Build APK

# Se déclenche uniquement sur un push de branche (pas sur un push de tag,
# pour éviter que la release créée plus bas ne redéclenche ce workflow en boucle).
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

# Autorise ce workflow à créer/mettre à jour une release GitHub.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Générer le fichier .env à partir des secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "AUTH_REDIRECT_URL=${{ secrets.AUTH_REDIRECT_URL }}" >> .env

      - name: Installer les dépendances
        run: flutter pub get

      - name: Build de l'APK (release)
        run: flutter build apk --release

      - name: Récupérer le SHA court du commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publier/mettre à jour la release "dev-latest" avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Build de dev — ${{ steps.vars.outputs.sha_short }}"
          body: |
            Build automatique généré depuis le commit ${{ github.sha }} (branche `${{ github.ref_name }}`).
            Cette release est réécrite à chaque push : elle contient toujours le dernier APK buildé.
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
